<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#cc0033"><title>ASCM | SAP Login Portal</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20232a;background:#f4f5f8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.shell{width:min(100%,420px);background:white;border-radius:22px;box-shadow:0 16px 60px #15192318;overflow:hidden}.top{background:#cc0033;color:white;padding:30px 26px;text-align:center}.mark{font-size:12px;letter-spacing:.18em;font-weight:800;opacity:.9}.top h1{font-size:25px;margin:12px 0 7px}.top p{font-size:13px;margin:0;opacity:.9}.content{padding:28px 25px 30px}label{display:block;font-size:14px;font-weight:700;margin-bottom:10px}input{width:100%;font:inherit;padding:15px;border:1.5px solid #d6d8df;border-radius:11px;outline:none}input:focus{border-color:#cc0033;box-shadow:0 0 0 3px #cc00331c}button{font:inherit;cursor:pointer}button.primary{width:100%;background:#cc0033;color:white;border:0;padding:15px;border-radius:11px;font-weight:750;margin-top:16px}button.primary:hover{background:#ae002a}.hint{font-size:12px;color:#737783;text-align:center;margin-top:17px}.error{color:#a90028;background:#fff0f2;border-radius:9px;padding:12px;font-size:13px;margin-top:16px}.success{font-weight:750;color:#13734d;margin-bottom:18px}.entry{background:#f7f8fa;border:1px solid #e9eaf0;border-radius:13px;padding:17px;margin-top:12px}.entry h3{font-size:14px;margin:0 0 13px}.field{margin:12px 0}.field .key{font-size:11px;color:#707681;text-transform:uppercase;letter-spacing:.07em;font-weight:750}.value{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}.value strong{font-size:20px;overflow-wrap:anywhere}.copy{border:1px solid #d5d8de;background:white;padding:7px 10px;border-radius:8px;font-size:12px;white-space:nowrap}.secondary{border:1px solid #d5d8de;background:white;width:100%;border-radius:10px;padding:13px;margin-top:18px;font-weight:700}.small{font-size:12px;color:#69707a;line-height:1.5}.hidden{display:none}.footer{text-align:center;padding:0 20px 22px;color:#8b8d96;font-size:11px}</style></head><body><main class="shell"><header class="top"><div class="mark">RUTGERS–NEWARK · ASCM</div><h1>SAP Login Portal</h1><p>Find your assigned SAP ECC practice account</p></header><div class="content"><section id="search"><form id="lookup"><label for="name">Enter your assigned name</label><input id="name" autocomplete="off" placeholder="e.g. Cheong" required autofocus><button class="primary" type="submit">Find My Account →</button></form><p class="hint">Names are matched regardless of capitalization.</p><div id="error" class="error hidden" role="alert"></div></section><section id="results" class="hidden" aria-live="polite"><div class="success">✓ Account found</div><p id="greeting" class="small"></p><div id="entries"></div><button class="secondary" id="back" type="button">← Search another name</button></section></div><footer class="footer">ASCM SAP Training · Practice accounts only</footer></main><script>

const normalize=s=>s.normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('en');
const $=id=>document.getElementById(id);
function field(label,value){const div=document.createElement('div');div.className='field';const title=document.createElement('div');title.className='key';title.textContent=label;const line=document.createElement('div');line.className='value';const strong=document.createElement('strong');strong.textContent=value;const copy=document.createElement('button');copy.type='button';copy.className='copy';copy.textContent='Copy';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(value);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy',1400)}catch(e){copy.textContent='Select text';}});line.append(strong,copy);div.append(title,line);return div}
$('lookup').addEventListener('submit',e=>{e.preventDefault();const term=normalize($('name').value);const matches=ACCOUNTS.filter(a=>normalize(a.name)===term);$('error').classList.add('hidden');if(!matches.length){$('error').textContent='No matching name was found. Check the spelling and try again.';$('error').classList.remove('hidden');return} $('entries').replaceChildren();$('greeting').textContent=matches.length>1?'Multiple accounts are assigned to this name. Please use the username assigned by your instructor.':'Here are the SAP credentials assigned to '+matches[0].name+'.';matches.forEach(a=>{const card=document.createElement('div');card.className='entry';const heading=document.createElement('h3');heading.textContent=a.name+' — '+a.user;card.append(heading,field('Client',a.client),field('User',a.user),field('Password',a.password));$('entries').append(card)});$('search').classList.add('hidden');$('results').classList.remove('hidden')});$('back').addEventListener('click',()=>{$('results').classList.add('hidden');$('search').classList.remove('hidden');$('name').value='';$('name').focus()});
</script></body></html>
