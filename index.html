`).join('')});results.addEventListener('click',async e=>{const b=e.target.closest('button[data-copy]');if(!b)return;try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1400)}catch{b.textContent='Select text to copy'}});</script></body></html>
